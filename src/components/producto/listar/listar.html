<div class="contenedor">
  <h2>Lista de Productos desde JSON</h2>

  @if (productos && productos.length > 0) {
    <table mat-table [dataSource]="productos" class="mat-elevation-z1 grilla-productos">

      <!-- Columna Nombre -->
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef> Producto </th>
        <td mat-cell *matCellDef="let p"> <h3>{{ p.nombre }}</h3> </td>
      </ng-container>

      <!-- Columna Precio -->
      <ng-container matColumnDef="precio">
        <th mat-header-cell *matHeaderCellDef> Precio </th>
        <td mat-cell *matCellDef="let p"> {{ p.precio | currency }} </td>
      </ng-container>

      <!-- Columna Descuento -->
      <ng-container matColumnDef="descuento">
        <th mat-header-cell *matHeaderCellDef> Descuento </th>
        <td mat-cell *matCellDef="let p"> {{ p.descuento }}% </td>
      </ng-container>

      <!-- Columna Vencimiento -->
      <ng-container matColumnDef="vencimiento">
        <th mat-header-cell *matHeaderCellDef> Vencimiento </th>
        <td mat-cell *matCellDef="let p"> {{ p.fecha_vencimiento | date:'dd/MM/yyyy' }} </td>
      </ng-container>

      <!-- Columna Acciones -->
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef> Acciones </th>
        <td mat-cell *matCellDef="let p">
          <button
            mat-icon-button
            color="warn"
            (click)="eliminarProducto(p)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <!-- Filas de la Grilla -->
      <tr mat-header-row *matHeaderRowDef="columnas"></tr>
      <tr mat-row *matRowDef="let row; columns: columnas;"></tr>
    </table>
  } @else {
    <div class="sin-productos">No hay productos disponibles</div>
  }

</div>
